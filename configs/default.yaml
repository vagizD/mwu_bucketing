# Experiment and simulation configuration

project:
  title: "Statistical vs. Practical Significance in Large-Scale A/B Testing"
  seed: 42

data:
  raw_transactions_path: "data/raw/transactions_train.csv"
  raw_customers_path: "data/raw/customers.csv"
  processed_spending_path: "data/processed/customer_spending.csv"
  synthetic_spending_path: "data/processed/synthetic_customer_spending.csv"
  # H&M dataset observation window: final ~10 weeks (2020-07-15 to 2020-09-22)
  window_start_date: "2020-07-15"
  window_end_date: "2020-09-22"
  chunksize: 500000

# Smoke test configuration for fast verification without full data
smoke_test:
  n_customers_universe: 50000
  zero_fraction: 0.65
  mean_nonzero_spend: 0.05
  sd_nonzero_spend: 0.08
  n_customers_per_arm: [500, 1000, 2000]
  bucket_counts: [5, 10, 20, 50]
  uplifts: [0.0, 0.01, 0.05]
  repetitions: 50
  alpha: 0.05
  practical_threshold: 0.01

# Main study simulation grid
main_study:
  # Feasible customer arm sizes
  n_customers_per_arm: [10000, 50000, 100000, 500000]
  bucket_counts: [10, 20, 50, 100, 200, 500]
  uplifts: [0.0, 0.001, 0.005, 0.01, 0.02]
  repetitions_pilot: 100
  repetitions_main: 500
  alpha: 0.05
  practical_threshold: 0.01
  power_target: 0.80

output:
  results_dir: "results"
  figures_dir: "results/figures"
  summary_csv: "results/summary.csv"
  report_dir: "report"
